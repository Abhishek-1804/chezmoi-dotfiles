# One entry per machine. Each host has a self-contained tree under hosts/<name>/.
# All hosts are provisioned locally — run the playbook on the machine itself.
all:
  hosts:
    mac:
      ansible_connection: local
      ansible_python_interpreter: /opt/homebrew/bin/python3
    ubuntu-desktop:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
    ubuntu-server:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
