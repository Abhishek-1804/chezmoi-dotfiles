- name: Check for existing LazyVim scaffold
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim/init.lua"
  register: nvim_init

- name: Remove any partial nvim config before scaffolding
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    state: absent
  when: not nvim_init.stat.exists

- name: Clone LazyVim starter
  ansible.builtin.git:
    repo: https://github.com/LazyVim/starter
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    depth: 1
  when: not nvim_init.stat.exists

- name: Detach starter from upstream git
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim/.git"
    state: absent
  when: not nvim_init.stat.exists
