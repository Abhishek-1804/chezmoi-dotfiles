- name: Provision mac
  hosts: mac
  gather_facts: true
  roles:
    - role: bootstrap
      tags: [bootstrap]
    - role: homebrew
      tags: [packages, brew]
    - role: lazyvim
      tags: [lazyvim, nvim]
    - role: chezmoi
      tags: [dotfiles, chezmoi]
    - role: macos_defaults
      tags: [defaults]
    - role: brew_maintenance
      tags: [never, maintenance]

- name: Provision ubuntu
  hosts: ubuntu
  gather_facts: true
  roles:
    - role: bootstrap
      tags: [bootstrap]
    - role: apt
      tags: [packages, apt]
    - role: external_installers
      tags: [packages, external]
    - role: docker
      tags: [docker]
    - role: lazyvim
      tags: [lazyvim, nvim]
    - role: chezmoi
      tags: [dotfiles, chezmoi]
