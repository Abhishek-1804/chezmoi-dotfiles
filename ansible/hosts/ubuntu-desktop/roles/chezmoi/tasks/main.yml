- name: Ensure chezmoi config dir exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/chezmoi"
    state: directory
    mode: "0700"

- name: Render chezmoi config
  ansible.builtin.template:
    src: chezmoi.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/chezmoi/chezmoi.toml"
    mode: "0600"

- name: Init chezmoi source from repo
  ansible.builtin.command: chezmoi init https://github.com/Abhishek-1804/chezmoi-dotfiles.git
  args:
    creates: "{{ ansible_facts['user_dir'] }}/dotfiles/.git"

- name: Apply dotfiles
  ansible.builtin.command: chezmoi apply
  register: chezmoi_apply
  changed_when: chezmoi_apply.stdout | length > 0
