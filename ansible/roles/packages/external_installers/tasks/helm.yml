- name: Check installed helm version
  ansible.builtin.command: helm version
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Download helm tarball
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}.tar.gz"
    mode: "0644"
  when: helm_version not in (helm_installed.stdout | default(''))

- name: Extract helm binary
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - "linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}/helm"
    extra_opts: ["--strip-components=1"]
    mode: "0755"
  when: helm_version not in (helm_installed.stdout | default(''))
