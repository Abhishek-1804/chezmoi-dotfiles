- name: Check installed k9s version
  ansible.builtin.command: k9s version
  register: k9s_installed
  changed_when: false
  failed_when: false

- name: Download k9s tarball
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Linux_{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.tar.gz"
    dest: "/tmp/k9s-{{ k9s_version }}.tar.gz"
    mode: "0644"
  when: k9s_version not in (k9s_installed.stdout | default(''))

- name: Extract k9s binary
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/k9s-{{ k9s_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - k9s
    mode: "0755"
  when: k9s_version not in (k9s_installed.stdout | default(''))
