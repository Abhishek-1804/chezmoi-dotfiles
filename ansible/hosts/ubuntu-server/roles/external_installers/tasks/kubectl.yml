- name: Check installed kubectl version
  ansible.builtin.command: kubectl version --client
  register: kubectl_installed
  changed_when: false
  failed_when: false

- name: Download kubectl binary
  become: true
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
  when: kubectl_version not in (kubectl_installed.stdout | default(''))
