all:
  children:
    mac:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /opt/homebrew/bin/python3
    ubuntu:
      hosts:
        ubuntu-laptop:
          ansible_host: CHANGEME_IP
          ansible_user: CHANGEME_USER
          ansible_connection: ssh
          ansible_python_interpreter: /usr/bin/python3
